plugins {
    id 'com.android.application'
}

def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.albus.dsh'
    compileSdk 35

    defaultConfig {
        applicationId "com.albus.dsh"
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName "1.1.6"
    }

    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (keystorePropsFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The bundled web snapshot must stay uncompressed so shouldInterceptRequest
    // can stream it without paying a zip-inflate cost per request.
    androidResources {
        noCompress 'js', 'css', 'html', 'json', 'webmanifest'
    }
}
